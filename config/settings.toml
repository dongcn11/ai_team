# AI Team Configuration
# =====================
# Sửa file này để thay đổi model, Slack, output directory
# Không cần sửa code trong ai_team/

[agents]
# Tool cho từng agent: chỉ "opencode".
#
# "claude" bị chặn cứng — pipeline này chạy nền không người giám sát, dùng
# subscription Claude cho nó sẽ bị khoá account. Chi tiết: ai_team/runner.py.
# Cần Claude Code thì mở terminal gõ `claude` thủ công, ngoài pipeline.
#
# Model format: provider/model-name (xem: opencode models)

pm_tool     = "opencode"
pm_model    = "opencode/qwen3.5-plus"

scrum_tool  = "opencode"
scrum_model = "opencode/qwen3.5-plus"

analyst_tool  = "opencode"
analyst_model = "opencode/qwen3.5-plus"

be1_tool  = "opencode"
be1_model = "opencode/qwen3.6-plus"     # Go plan: 3,300 credits

be2_tool  = "opencode"
be2_model = "opencode/minimax-m2.7"     # Go plan: 3,400 credits

fe1_tool  = "opencode"
fe1_model = "opencode/qwen3.5-plus"     # Go plan: 10,200 credits

fe2_tool  = "opencode"
fe2_model = "opencode/qwen3.5-plus"     # Go plan: 10,200 credits

leader_tool  = "opencode"
leader_model = "opencode/qwen3.6-plus"   # review code — dùng model mạnh hơn

[slack]
# Điền token sau khi tạo Slack App
# Hướng dẫn: xem README.md phần Slack Setup
bot_token = "xoxb-your-token-here"
channel   = "#ai-team"

[output]
# Thư mục lưu project được tạo ra
directory = "./output"

[timeouts]
# Giây — tăng nếu model chậm hoặc task phức tạp
claude_code = 600
opencode    = 600

[tech_stack]
# Tech stack mặc định cho coding agents
backend  = "Python FastAPI + SQLModel + SQLite"
frontend = "React + TypeScript + Vite + TailwindCSS"

[pipeline]
# Định nghĩa quy trình: enable/disable các stages
# Stages chạy theo thứ tự cố định: pm → scrum → analyst → coding → leader → fix
#
# Defaults (áp dụng nếu không khai báo gì ở dưới):
#   pm/scrum/analyst/leader/fix: enabled=true, timeout_s=600
#   coding: enabled=true, timeout_s=1800, parallel=[be1,be2,fe1,fe2,fs1,fs2]
#
# Profile (profiles.yaml) có thể tắt mặc định 1 số stage qua field `stages_disabled`.
# Section [pipeline.stages.*] dưới đây sẽ ĐÈ LÊN profile defaults — chỉ khai báo khi
# project cần override profile.

# Stage definitions (mở comment khi cần override)

# [pipeline.stages.pm]
# enabled = true
# timeout_s = 600

# [pipeline.stages.scrum]
# enabled = true
# timeout_s = 600

# [pipeline.stages.analyst]
# enabled = true
# timeout_s = 600

# [pipeline.stages.coding]
# enabled = true
# timeout_s = 1800
# parallel = ["be1", "be2", "fe1", "fe2", "fs1", "fs2"]

# [pipeline.stages.leader]
# enabled = true
# timeout_s = 600

# [pipeline.stages.fix]
# enabled = true
# timeout_s = 600
# depends_on = "leader"
