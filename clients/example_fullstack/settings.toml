# Project: Example Fullstack
# Profile: fullstack (PM + Scrum + Analyst + BE1 + BE2 + FE1 + FE2 + Leader)

[project]
name    = "Example Fullstack"
profile = "fullstack"

[agents]
pm_tool     = "claude"
pm_model    = ""

scrum_tool  = "claude"
scrum_model = ""

analyst_tool  = "claude"
analyst_model = ""

be1_tool  = "opencode"
be1_model = "opencode-go/qwen3.6-plus"

be2_tool  = "opencode"
be2_model = "opencode-go/minimax-m2.7"

fe1_tool  = "opencode"
fe1_model = "opencode-go/qwen3.5-plus"

fe2_tool  = "opencode"
fe2_model = "opencode-go/qwen3.5-plus"

leader_tool  = "claude"
leader_model = ""

[slack]
bot_token = "xoxb-your-token-here"
channel   = "#ai-team"

[output]
directory = "./clients/example_fullstack/output"

[timeouts]
claude_code = 600
opencode    = 600

[tech_stack]
backend  = "Python FastAPI + SQLModel + SQLite"
frontend = "React + TypeScript + Vite + TailwindCSS"

# ─────────────────────────────────────────────────────────────────────────────
# PIPELINE — Tùy chỉnh quy trình riêng cho dự án này (tùy chọn)
# ─────────────────────────────────────────────────────────────────────────────
# Mỗi stage có 3 thuộc tính:
#   enabled    — true/false: bật/tắt stage
#   timeout_s  — giây: override timeout mặc định (claude_code/opencode ở trên)
#   parallel   — chỉ áp dụng cho stage 'coding', danh sách agent chạy song song
#
# Nếu BỎ section [pipeline.stages] này, project dùng default:
#   pm → scrum → analyst → coding → leader → fix (tất cả enabled)
#
# Có thể override nhanh từ CLI mà không cần edit file:
#   python main.py --config clients/example_fullstack/settings.toml --disable-stage scrum --disable-stage fix

# [pipeline.stages.pm]
# enabled = true
# timeout_s = 600

# [pipeline.stages.scrum]
# enabled = false        # skip Scrum cho project nhỏ

# [pipeline.stages.analyst]
# enabled = true
# timeout_s = 900        # cho Analyst thêm thời gian nếu PRD phức tạp

# [pipeline.stages.coding]
# enabled = true
# timeout_s = 2400       # tăng timeout vì BE/FE chạy song song lâu
# parallel = ["be1", "be2", "fe1", "fe2"]

# [pipeline.stages.leader]
# enabled = true
# timeout_s = 900

# [pipeline.stages.fix]
# enabled = true
# timeout_s = 900
# depends_on = "leader"  # chỉ chạy nếu Leader xong và có high-severity issues
