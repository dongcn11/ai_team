# Đứng sau ngrok / reverse proxy: ngrok nối vào bằng http nên $scheme luôn là
# "http" — giữ nguyên X-Forwarded-Proto mà proxy gửi (https) để API bật cờ Secure
# cho cookie đăng nhập. Không có proxy thì dùng $scheme như cũ.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    # IP thật của người dùng: qua ngrok mọi request đều tới từ mạng nội bộ docker,
    # nên lấy IP từ X-Forwarded-For proxy gửi kèm. Không có dòng này thì chặn dò
    # mật khẩu (theo IP) khoá NHẦM mọi người khi 1 người gõ sai nhiều lần.
    set_real_ip_from  127.0.0.1;
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # index.html KHÔNG được cache: mỗi lần build lại, Vite đổi tên file asset
    # (index-<hash>.js). Nếu browser giữ index.html cũ, nó sẽ xin asset cũ đã bị
    # xoá → rơi vào try_files và nhận về HTML → module script lỗi → trang trắng.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location / {
        try_files $uri /index.html;
    }

    # Asset có hash trong tên nên bất biến; xin file không tồn tại phải trả 404
    # thẳng, KHÔNG fallback về index.html (tránh nhận HTML mà tưởng là JS).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Model Live2D (~5MB, xem src/components/Live2DFigure.tsx): thiếu file thì 404
    # thẳng như /assets/. Tên file không có hash nên chỉ cache 1 ngày.
    location /live2d/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location /api/ {
        proxy_pass         http://api:8000/api/;
        # $http_host giữ nguyên cả cổng ("localhost:3000"); $host CẮT cổng đi.
        # FastAPI dựng URL tuyệt đối cho redirect 307 (khi URL thiếu "/" cuối) từ
        # header Host — dùng $host thì Location thành http://localhost/... (cổng 80),
        # browser đi lạc và request coi như hỏng.
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 60s;
        # File đính kèm khung Trò chuyện tới 15MB/file (mặc định nginx chỉ 1MB).
        client_max_body_size 20m;
    }

    # LLM gateway cho hệ thống ngoài (chuẩn OpenAI). Model sinh câu trả lời dài
    # mất cả phút → timeout dài hơn /api/ nhiều, không thì nginx cắt 504 giữa chừng.
    location /v1/ {
        proxy_pass         http://api:8000/v1/;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 600s;
        client_max_body_size 20m;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }
}
