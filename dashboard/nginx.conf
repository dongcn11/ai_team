server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # index.html KHÔNG được cache: mỗi lần build lại, Vite đổi tên file asset
    # (index-<hash>.js). Nếu browser giữ index.html cũ, nó sẽ xin asset cũ đã bị
    # xoá → rơi vào try_files và nhận về HTML → module script lỗi → trang trắng.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location / {
        try_files $uri /index.html;
    }

    # Asset có hash trong tên nên bất biến; xin file không tồn tại phải trả 404
    # thẳng, KHÔNG fallback về index.html (tránh nhận HTML mà tưởng là JS).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /api/ {
        proxy_pass         http://api:8000/api/;
        # $http_host giữ nguyên cả cổng ("localhost:3000"); $host CẮT cổng đi.
        # FastAPI dựng URL tuyệt đối cho redirect 307 (khi URL thiếu "/" cuối) từ
        # header Host — dùng $host thì Location thành http://localhost/... (cổng 80),
        # browser đi lạc và request coi như hỏng.
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }
}
