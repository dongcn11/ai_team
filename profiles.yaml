# AI Team Profiles
# =================
# Định nghĩa các team composition + workflow cho từng loại dự án.
# Dùng trong settings.toml: [project] profile = "fullstack"
# Hoặc dùng CLI: python main.py --profile backend_only
#
# Mỗi profile có 2 field:
#   agents          — danh sách agent enable cho profile này (bắt buộc)
#   stages_disabled — danh sách stage bị tắt mặc định (tùy chọn)
#                     Settings.toml [pipeline.stages] và CLI --enable-stage vẫn override được.
# Stage hợp lệ: pm, scrum, analyst, coding, leader, fix

profiles:

  fullstack:
    label: "Full-stack Web"
    agents: [pm, scrum, analyst, be1, be2, fe1, fe2, leader]

  backend_only:
    label: "Backend Only"
    agents: [pm, scrum, analyst, be1, be2, leader]

  api_only:
    label: "API Only (lean)"
    agents: [pm, analyst, be1, leader]

  mobile_app:
    label: "Mobile + Backend"
    agents: [pm, scrum, analyst, be1, be2, fe1, fe2, leader]

  frontend_only:
    label: "Frontend Only"
    agents: [pm, scrum, analyst, fe1, fe2, leader]

  solo_backend:
    label: "Solo Backend"
    agents: [pm, analyst, be1, leader]

  solo_fullstack:
    label: "Solo Full-stack"
    agents: [pm, analyst, be1, fe1, leader]

  dual_fullstack:
    label: "Dual Full-stack (không chia BE/FE)"
    agents: [pm, scrum, analyst, fs1, fs2, leader]

  fs_retry:
    label: "Retry FS agents only"
    agents: [fs1, fs2, leader]

  lean_fullstack:
    label: "Lean Full-stack (Fast - skip scrum)"
    agents: [pm, analyst, be1, fe1, leader]

  backend_fast:
    label: "Backend Only (Code-first - skip scrum & analyst)"
    agents: [pm, be1, leader]

  poc:
    label: "POC Mode (Minimal - single agent)"
    agents: [analyst, be1]

  pm_fullstack_quick:
    label: "PM + Fullstack Quick (no scrum, no review)"
    # PM viết user stories, Analyst chia task cho FS, FS1+FS2 code song song.
    # Bỏ Scrum (project nhỏ) và Leader+Fix (không cần review).
    agents: [pm, analyst, fs1, fs2]
    stages_disabled: [scrum, leader, fix]
